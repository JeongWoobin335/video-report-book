<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP 캐싱 기초 (웹 성능 입문 3강) — 이해도 확인</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e2da;
    --accent: #2f5fd0; --accent-soft: #e8eefc; --ok: #1a7f4b; --ok-soft: #e9f6ee; --bad: #b42318; --bad-soft: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa2ad; --line: #30353d;
      --accent: #8fb0ff; --accent-soft: #232c45; --ok: #6fd39b; --ok-soft: #1c3226; --bad: #ff9b91; --bad-soft: #3a1f1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 96px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 0 0 16px; }
  .q h2 { font-size: 17px; font-weight: 600; margin: 0 0 14px; display: flex; gap: 10px; }
  .q h2 .num { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  label.choice {
    display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin: 8px 0 0;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  label.choice:hover { border-color: var(--accent); }
  label.choice input { margin: 5px 0 0; accent-color: var(--accent); flex: none; }
  label.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
  .done label.choice { cursor: default; }
  .done label.choice:hover { border-color: var(--line); }
  .done label.choice.right { border-color: var(--ok); background: var(--ok-soft); }
  .done label.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .mark { margin-left: auto; font-size: 13px; font-weight: 600; flex: none; }
  .right .mark { color: var(--ok); } .wrong .mark { color: var(--bad); }
  .explain { display: none; margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--bg); font-size: 15px; }
  .done .explain { display: block; }
  .explain a.ts {
    display: inline-block; margin-top: 8px; font-size: 13.5px; text-decoration: none; font-variant-numeric: tabular-nums;
    color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
  }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
  .bar div { max-width: 720px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar span { color: var(--muted); font-size: 14px; }
  button {
    margin-left: auto; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
    border-radius: 10px; padding: 10px 20px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #10131a; } }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #result { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 0 0 20px; }
  #result strong { font-size: 22px; }
  #result ul { margin: 10px 0 0; padding-left: 20px; }
  #result a { color: var(--accent); }
  #result strong { font-size: 19px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div id="result"></div>
  <form id="quiz"></form>
</main>
<div class="bar"><div><span id="progress"></span><button id="submit" disabled>제출하기</button></div></div>

 "저장해 두고, 확인 없이 계속 씁니다"}, {"id": "c", "text": "본문은 버리고 `ETag`만 저장해 둡니다"}, {"id": "d", "text": "디스크에 아예 저장하지 않습니다"}], "answer": "a", "explanation": "강사가 가장 헷갈리기 쉽다고 짚은 부분입니다. `no-cache`는 이름과 달리 \"캐시하지 말라\"가 아니라, 저장은 하되 쓸 때마다 서버에 아직 써도 되는지 반드시 확인하라는 뜻입니다. 아예 저장하지 않는 것은 `no-store`입니다.", "sources": ["p19", "p17"], "section": "no-cache와 no-store", "review": {"start": 275, "end": 305}}, {"id": "q5", "checks": "understanding", "question": "은행 거래 내역처럼 민감한 응답에는 이 강의에서 어떤 설정을 쓴다고 했나요?", "choices": [{"id": "a", "text": "`no-cache`를 줍니다"}, {"id": "b", "text": "`no-store`를 줍니다"}, {"id": "c", "text": "`max-age`를 1년으로 줍니다"}, {"id": "d", "text": "`If-None-Match`를 줍니다"}], "answer": "b", "explanation": "`no-store`가 붙으면 브라우저는 응답을 디스크에 아예 남기지 않으므로 민감한 응답에 씁니다. `no-cache`는 저장은 하고 매번 검증만 하는 것이어서, 저장본이 디스크에 남습니다.", "sources": ["p20", "p18"], "section": "no-cache와 no-store", "review": {"start": 305, "end": 335}}, {"id": "q6", "checks": "recall", "question": "이 강의의 설명에 따르면 `ETag` 값은 언제 바뀌나요?", "choices": [{"id": "a", "text": "`max-age`로 정한 기간이 끝날 때"}, {"id": "b", "text": "브라우저가 저장본을 다시 쓸 때마다"}, {"id": "c", "text": "리소스 내용이 한 글자라도 바뀔 때"}, {"id": "d", "text": "서버가 응답을 새로 보낼 때마다"}], "answer": "c", "explanation": "`ETag`는 서버가 리소스 내용에 붙이는 지문 같은 값이어서, 내용이 한 글자라도 바뀌면 함께 바뀝니다. 시간이 지나거나 요청이 오간다고 바뀌는 값이 아니기 때문에 \"내용이 그대로인지\"를 확인하는 데 쓸 수 있습니다.", "sources": ["p10"], "section": "핵심 개념", "review": {"start": 375, "end": 405}}, {"id": "q7", "checks": "recall", "question": "저장본이 아직 유효한지 확인할 때, 브라우저는 기억해 둔 `ETag`를 어떤 헤더에 담아 보내나요?", "choices": [{"id": "a", "text": "`Not-Modified`"}, {"id": "b", "text": "`Cache-Control`"}, {"id": "c", "text": "`ETag`"}, {"id": "d", "text": "`If-None-Match`"}], "answer": "d", "explanation": "브라우저는 `If-None-Match` 헤더에 `ETag`를 담아 \"내가 가진 게 이 버전인데 아직 맞냐\"고 묻습니다. `ETag` 헤더는 서버가 응답에 붙여 주는 쪽이고, `Not Modified`는 서버가 돌려주는 `304` 응답의 이름입니다.", "sources": ["p23"], "section": "ETag로 검증하기", "review": {"start": 420, "end": 450}}, {"id": "q8", "checks": "understanding", "question": "브라우저가 보낸 `ETag`가 서버가 가진 것과 같을 때, 서버는 무엇을 돌려주나요?", "choices": [{"id": "a", "text": "`304 Not Modified`와 함께 본문을 보냅니다"}, {"id": "b", "text": "`200 OK`와 함께 같은 본문을 다시 보냅니다"}, {"id": "c", "text": "본문 없이 `304 Not Modified`만 돌려줍니다"}, {"id": "d", "text": "본문 없이 `200 OK`와 새 `ETag`만 보냅니다"}], "answer": "c", "explanation": "`ETag`가 같으면 내용이 그대로라는 뜻이므로 서버는 본문 없이 `304 Not Modified`만 돌려주고, 브라우저는 저장본을 그대로 씁니다. 본문을 보내지 않아서 훨씬 가볍습니다. `200 OK`와 새 본문·새 `ETag`가 오는 것은 `ETag`가 다를 때입니다.", "sources": ["p24", "p26"], "section": "ETag로 검증하기", "review": {"start": 445, "end": 475}}, {"id": "q9", "checks": "understanding", "question": "파일 이름에 해시가 들어가는 JS·CSS 파일은 `max-age`를 1년으로 길게 줘도 안전하다고 했습니다. 그 이유는 무엇인가요?", "choices": [{"id": "a", "text": "내용이 바뀌면 파일 이름도 바뀌기 때문입니다"}, {"id": "b", "text": "쓸 때마다 `ETag`로 서버에 확인하기 때문입니다"}, {"id": "c", "text": "JS·CSS는 내용이 거의 바뀌지 않기 때문입니다"}, {"id": "d", "text": "배포하면 브라우저 저장본이 지워지기 때문입니다"}], "answer": "a", "explanation": "내용이 바뀌면 파일 이름(해시)이 바뀌어 브라우저에게는 전혀 다른 리소스가 되므로, 옛 저장본이 오래 남아 있어도 문제 될 일이 없습니다. `max-age` 기간 안에는 서버에 확인 요청 자체가 나가지 않으므로 `ETag` 검증 덕분이 아닙니다.", "sources": ["p27"], "section": "실무 팁", "review": {"start": 495, "end": 525}}, {"id": "q10", "checks": "understanding", "question": "새로 배포하면 사용자가 바로 새 버전을 받아야 하는 HTML 문서에는, 이 강의에서 어떤 설정을 권했나요?", "choices": [{"id": "a", "text": "`no-store`를 줍니다"}, {"id": "b", "text": "`no-cache`를 줍니다"}, {"id": "c", "text": "`max-age`를 1년으로 줍니다"}, {"id": "d", "text": "`Cache-Control`을 생략합니다"}], "answer": "b", "explanation": "HTML 문서에는 `no-cache`를 주는 것이 일반적이라고 했습니다. 저장은 하되 쓸 때마다 서버에 확인하므로, 새로 배포하면 사용자가 바로 새 버전을 받습니다. `max-age` 1년은 파일 이름에 해시가 들어가는 JS·CSS에 권한 설정입니다.", "sources": ["p28"], "section": "실무 팁", "review": {"start": 525, "end": 555}}]}</script>
<script>
  var quiz = JSON.parse(document.getElementById("data").textContent);
  var answers = {};

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>"); }
  function ts(sec) {
    sec = Math.floor(sec); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  document.getElementById("title").textContent = quiz.title;
  document.getElementById("lead").textContent = quiz.type === "meeting"
    ? "점수를 매기는 것이 아니라, 회의에서 정해진 내용을 서로 같게 알고 있는지 확인하는 " + quiz.items.length + "개의 질문입니다. 다르게 알고 계신 부분은 녹화본의 해당 구간을 알려드립니다."
    : "영상 내용을 바탕으로 한 " + quiz.items.length + "개의 질문입니다. 틀린 문항은 다시 볼 구간을 알려드립니다.";

  var form = document.getElementById("quiz");
  form.innerHTML = quiz.items.map(function (q, i) {
    return '<section class="q" id="' + q.id + '"><h2><span class="num">' + (i + 1) + '.</span><span>' + md(q.question) + '</span></h2>' +
      q.choices.map(function (c) {
        return '<label class="choice" data-c="' + c.id + '"><input type="radio" name="' + q.id + '" value="' + c.id + '"><span>' + md(c.text) + '</span><span class="mark"></span></label>';
      }).join("") +
      '<div class="explain">' + md(q.explanation) + '<br><a class="ts" href="#t=' + q.review.start + '" data-t="' + q.review.start + '">▶ 다시 보기 ' + ts(q.review.start) + '–' + ts(q.review.end) + '</a></div></section>';
  }).join("");

  function refresh() {
    var n = Object.keys(answers).length;
    document.getElementById("progress").textContent = n + " / " + quiz.items.length + " 응답";
    document.getElementById("submit").disabled = n < quiz.items.length;
  }
  refresh();

  form.addEventListener("change", function (e) {
    answers[e.target.name] = e.target.value;
    e.target.closest(".q").querySelectorAll(".choice").forEach(function (l) { l.classList.toggle("picked", l.contains(e.target)); });
    refresh();
  });

  document.getElementById("submit").addEventListener("click", function () {
    var right = 0, wrongSections = {};
    quiz.items.forEach(function (q) {
      var box = document.getElementById(q.id), ok = answers[q.id] === q.answer;
      if (ok) right++; else wrongSections[q.section] = (wrongSections[q.section] || 0) + 1;
      box.classList.add("done");
      box.querySelectorAll("input").forEach(function (i) { i.disabled = true; });
      box.querySelectorAll(".choice").forEach(function (l) {
        l.classList.remove("picked");
        if (l.dataset.c === q.answer) { l.classList.add("right"); l.querySelector(".mark").textContent = ok ? "정답" : "정답은 이것"; }
        else if (l.dataset.c === answers[q.id]) { l.classList.add("wrong"); l.querySelector(".mark").textContent = "선택하신 답"; }
        if (quiz.type === "meeting" && l.dataset.c === q.answer) l.querySelector(".mark").textContent = ok ? "맞습니다" : "회의에서는 이렇게";
      });
    });
    var r = document.getElementById("result"), weak = Object.keys(wrongSections);
    var missed = quiz.items.filter(function (q) { return answers[q.id] !== q.answer; });
    if (quiz.type === "meeting") {
      // 회의는 점수를 보여주지 않는다 — 동료에게 시험 성적을 매기는 것처럼 보이면 안 된다.
      r.innerHTML = missed.length
        ? "<strong>다시 확인하실 부분이 " + missed.length + "곳 있습니다.</strong><ul>" + missed.map(function (q) {
            return '<li><a href="#' + q.id + '">' + md(q.question) + "</a></li>"; }).join("") + "</ul>"
        : "<strong>회의 내용을 모두 정확히 알고 계십니다.</strong>";
    } else {
      r.innerHTML = "<strong>" + quiz.items.length + "개 중 " + right + "개</strong>를 맞히셨습니다." +
        (weak.length ? "<ul>" + weak.map(function (s) { return "<li>" + esc(s) + " — " + wrongSections[s] + "개 틀림</li>"; }).join("") + "</ul>" : " 영상 내용을 잘 파악하고 계십니다.");
    }
    r.style.display = "block";
    document.querySelector(".bar").style.display = "none";
    window.scrollTo({ top: 0, behavior: "smooth" });
    // 웹 앱 안에 끼워져 있으면 응답을 바깥 앱에 넘긴다 (서버 채점·집계는 quiz-grading 스킬의 몫)
    if (window.parent !== window) window.parent.postMessage({ type: "quiz-submit", answers: answers, correct: right, total: quiz.items.length }, "*");
  });

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.ts");
    if (!a) return;
    e.preventDefault();
    if (window.parent !== window) window.parent.postMessage({ type: "seek", t: Number(a.dataset.t) }, "*");
  });
</script>
</body>
</html>
