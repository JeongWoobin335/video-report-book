<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>만화로 보는 HTTP 캐싱 기초</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #6b7280; --ink: #23262d;
    --accent: #2f5fd0; --accent-soft: #e8eefc; --wall: #f3ead9; --floor: #dcc9a6; --plain: #eaf0fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa2ad; --accent: #8fb0ff; --accent-soft: #232c45; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  }
  main { max-width: 880px; margin: 0 auto; padding: 36px 16px 72px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 14.5px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  /* 컷: 위에 말풍선(길이에 따라 늘어남), 아래에 무대(인물 + 보드). 컷 안은 늘 밝은 종이색 — 만화는 다크모드에서도 종이 위에 있다. */
  .panel { margin: 0; display: flex; flex-direction: column; border: 2.5px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; color: #1f2328; }
  .bubbles { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 12px 12px 14px; min-height: 96px; background: var(--plain); }
  .panel.office .bubbles { background: var(--wall); }
  .bubble { position: relative; max-width: 84%; padding: 7px 13px; border: 2px solid var(--ink); border-radius: 16px; background: #fff; font-size: 15.5px; font-weight: 500; }
  .bubble.left { align-self: flex-start; } .bubble.right { align-self: flex-end; }
  .bubble::after { content: ""; position: absolute; bottom: -10px; width: 14px; height: 14px; background: #fff; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg) skew(12deg, 12deg); }
  .bubble.left::after { left: 26px; } .bubble.right::after { right: 26px; }
  .bubble code, figcaption code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; background: var(--accent-soft); color: #1d3a8a; padding: 0 4px; border-radius: 4px; }
  .stage { position: relative; aspect-ratio: 16 / 9; background: var(--plain); }
  .office .stage { background: linear-gradient(var(--wall) 0 72%, var(--floor) 72% 100%); }
  .actor { position: absolute; bottom: 0; width: 31%; }
  .actor.left { left: 1%; } .actor.right { right: 1%; }
  .actor svg { display: block; width: 100%; height: auto; }
  .actor .name { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
  .board { position: absolute; top: 6%; bottom: 12%; left: 31%; right: 31%; border: 3px solid var(--ink); border-radius: 8px; background: #fff; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .solo .board { right: 4%; }
  .board img { width: 100%; height: 100%; object-fit: contain; display: block; background: #111; }
  .board pre { margin: 0; padding: 8px 10px; font: 600 10.5px/1.45 "Malgun Gothic", system-ui, sans-serif; white-space: pre-wrap; color: #1f2328; height: 100%; overflow: hidden; }
  .board pre::first-line { font-size: 12px; color: #1d3a8a; }
  figcaption { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 2.5px solid var(--ink); font-size: 13.5px; background: #fffdf6; min-height: 38px; }
  figcaption .n { font-weight: 800; flex: none; }
  figcaption .nar { flex: 1; }
  a.ts { flex: none; margin-left: auto; font-size: 12.5px; text-decoration: none; font-variant-numeric: tabular-nums; color: #1d3a8a; background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="grid" id="grid"></div>
</main>
<script id="cast" type="application/json">{"characters": {"mentor": {"skin": "#f2c9a5", "hair": "#2b2b33", "shirt": "#34507a", "hairstyle": "bob", "glasses": true}, "newbie": {"skin": "#f6d3b3", "hair": "#7a4a2b", "shirt": "#e8833a", "hairstyle": "short", "glasses": false}, "peer": {"skin": "#e8b88f", "hair": "#1f1f1f", "shirt": "#3f8f6b", "hairstyle": "long", "glasses": false}}, "moods": {"explain": {"eyes": "dot", "brow": "flat", "mouth": "open", "arm": "point", "mark": ""}, "ask": {"eyes": "dot", "brow": "flat", "mouth": "open", "arm": "raise", "mark": "?"}, "confused": {"eyes": "dot", "brow": "tilt", "mouth": "flat", "arm": "down", "mark": "?"}, "surprised": {"eyes": "wide", "brow": "up", "mouth": "o", "arm": "down", "mark": "!"}, "happy": {"eyes": "arc", "brow": "flat", "mouth": "smile", "arm": "down", "mark": ""}, "worried": {"eyes": "dot", "brow": "sad", "mouth": "frown", "arm": "down", "mark": ""}, "think": {"eyes": "dot", "brow": "flat", "mouth": "flat", "arm": "chin", "mark": "…"}, "neutral": {"eyes": "dot", "brow": "flat", "mouth": "smile", "arm": "down", "mark": ""}}}</script>
<script id="data" type="application/json">{"title": "만화로 보는 HTTP 캐싱 기초", "type": "education", "report_title": "HTTP 캐싱 기초 (웹 성능 입문 3강)", "panels": [{"n": 1, "sources": ["p13"], "t": 125, "background": {"kind": "office"}, "narration": "", "people": [{"name": "신입", "character": "newbie", "side": "left", "mood": "ask"}, {"name": "선배", "character": "mentor", "side": "right", "mood": "explain"}], "bubbles": [{"name": "신입", "side": "left", "text": "쇼핑몰 로고는 몇 달째 그대로인데, 열 때마다 새로 받아요?"}, {"name": "선배", "side": "right", "text": "그러면 낭비지. 그래서 캐시가 있는 거야."}], "t_label": "02:05"}, {"n": 2, "sources": ["p5", "p11", "p12"], "t": 70, "background": {"kind": "screen", "time": 68, "text": "캐시(Cache)란?\n한 번 받은 응답의 복사본을 가까운 곳에 저장해 두고 재사용하는 것\n\n왜?\n· 사용자: 더 빠른 로딩\n· 서버: 요청 수 ↓ 부하·비용 ↓", "image": null}, "narration": "캐시 = 복사본을 가까운 곳에", "people": [{"name": "선배", "character": "mentor", "side": "left", "mood": "explain"}, {"name": "신입", "character": "newbie", "side": "right", "mood": "happy"}], "bubbles": [{"name": "선배", "side": "left", "text": "한 번 받은 응답의 복사본을 가까이 두고 다시 쓰는 거야."}, {"name": "신입", "side": "right", "text": "사용자는 빨리 뜨고, 서버는 요청이 줄겠네요!"}], "t_label": "01:10"}, {"n": 3, "sources": ["p7", "p8", "p15"], "t": 180, "background": {"kind": "office"}, "narration": "`max-age` = 신선한 기간(초 단위)", "people": [{"name": "신입", "character": "newbie", "side": "left", "mood": "ask"}, {"name": "선배", "character": "mentor", "side": "right", "mood": "explain"}], "bubbles": [{"name": "신입", "side": "left", "text": "복사본을 언제까지 써도 되는지는 누가 정해요?"}, {"name": "선배", "side": "right", "text": "서버가 `Cache-Control` 헤더의 `max-age`로 알려줘."}, {"name": "선배", "side": "right", "text": "그 기간엔 서버에 묻지도 않아. 요청 자체가 안 나가."}], "t_label": "03:00"}, {"n": 4, "sources": ["p19"], "t": 275, "background": {"kind": "office"}, "narration": "강의 슬라이드에도 경고가 있다: no-cache ≠ 캐시 안 함", "people": [{"name": "신입", "character": "newbie", "side": "left", "mood": "confused"}, {"name": "선배", "character": "mentor", "side": "right", "mood": "surprised"}], "bubbles": [{"name": "신입", "side": "left", "text": "그럼 `no-cache`는 캐시하지 말라는 뜻이죠?"}, {"name": "선배", "side": "right", "text": "아니! 이름에 속으면 안 돼."}], "t_label": "04:35"}, {"n": 5, "sources": ["p17", "p18", "p20"], "t": 275, "background": {"kind": "screen", "time": 258, "text": "헷갈리기 쉬운 두 가지\n\nno-cache  저장 O, 사용할 때마다 서버에 검증\nno-store  저장 X (민감한 응답)\n\n⚠ no-cache ≠ 캐시 안 함", "image": null}, "narration": "", "people": [{"name": "선배", "character": "mentor", "side": "left", "mood": "explain"}, {"name": "신입", "character": "newbie", "side": "right", "mood": "surprised"}], "bubbles": [{"name": "선배", "side": "left", "text": "`no-cache`는 저장은 해. 쓸 때마다 서버에 확인할 뿐이야."}, {"name": "선배", "side": "left", "text": "아예 저장을 안 하는 건 `no-store`. 은행 거래 내역 같은 데 써."}], "t_label": "04:35"}, {"n": 6, "sources": ["p10", "p23", "p24", "p26"], "t": 375, "background": {"kind": "screen", "time": 353, "text": "ETag로 검증하기\n\n① 첫 응답: 200 OK + ETag: \"a1b2c3\"\n② 재요청: If-None-Match: \"a1b2c3\"\n③-a 같으면: 304 Not Modified (본문 없음)\n③-b 다르면: 200 OK + 새 본문 + 새 ETag", "image": null}, "narration": "`If-None-Match` → `304 Not Modified`", "people": [{"name": "신입", "character": "newbie", "side": "left", "mood": "ask"}, {"name": "선배", "character": "mentor", "side": "right", "mood": "explain"}], "bubbles": [{"name": "신입", "side": "left", "text": "서버에 확인은 어떻게 해요?"}, {"name": "선배", "side": "right", "text": "내용의 지문인 `ETag`를 보내서 \"이 버전 아직 맞아?\" 하고 묻지."}, {"name": "선배", "side": "right", "text": "같으면 본문 없이 `304`만 와. 훨씬 가볍지."}], "t_label": "06:15"}, {"n": 7, "sources": ["p27", "p28"], "t": 495, "background": {"kind": "screen", "time": 492, "text": "실무 팁\n\napp.3f9a1c.js   Cache-Control: max-age=31536000\nindex.html      Cache-Control: no-cache", "image": null}, "narration": "내용이 바뀌면 파일 이름도 바뀌니 옛 캐시가 문제 되지 않는다", "people": [{"name": "선배", "character": "mentor", "side": "left", "mood": "explain"}, {"name": "신입", "character": "newbie", "side": "right", "mood": "think"}], "bubbles": [{"name": "선배", "side": "left", "text": "이름에 해시가 든 JS·CSS는 `max-age`를 1년으로 길게."}, {"name": "선배", "side": "left", "text": "HTML은 `no-cache`. 배포하면 바로 새 버전을 받게."}], "t_label": "08:15"}, {"n": 8, "sources": ["p31", "p21", "p33"], "t": 335, "background": {"kind": "office"}, "narration": "", "people": [{"name": "신입", "character": "newbie", "side": "left", "mood": "happy"}, {"name": "선배", "character": "mentor", "side": "right", "mood": "happy"}], "bubbles": [{"name": "신입", "side": "left", "text": "`no-cache`는 매번 검증, `no-store`는 저장 금지!"}, {"name": "선배", "side": "right", "text": "그거 시험·면접 단골이래. 다음 시간은 CDN 캐시야."}], "t_label": "05:35"}]}</script>
<script>
// 캐릭터를 SVG로 그린다. 생김새와 표정의 정의는 cast.json에 있고, 여기는 그것을 선과 도형으로 옮기는 코드다.
// 그림체를 바꾸려면 이 파일의 drawCharacter만 바꾸면 된다: (캐릭터 id, 표정 id, 좌우반전 여부) → SVG 문자열.
function drawCharacter(CAST, charId, moodId, flip) {
  var c = CAST.characters[charId], m = CAST.moods[moodId] || CAST.moods.neutral;
  var ink = "#23262d", p = [];

  // 뒤로 늘어지는 머리(긴 머리)는 몸보다 먼저 그린다
  if (c.hairstyle === "long") p.push('<path d="M27,56 Q25,16 60,16 Q95,16 93,56 L96,118 Q60,128 24,118 Z" fill="' + c.hair + '"/>');

  // 왼팔(늘 내림) → 몸통 → 목 → 머리
  p.push('<path d="M32,112 L24,152" stroke="' + c.shirt + '" stroke-width="13" stroke-linecap="round" fill="none"/>');
  p.push('<circle cx="24" cy="155" r="6.5" fill="' + c.skin + '"/>');
  p.push('<path d="M26,172 Q24,100 60,98 Q96,100 94,172 Z" fill="' + c.shirt + '"/>');
  p.push('<rect x="53" y="76" width="14" height="26" rx="5" fill="' + c.skin + '"/>');
  p.push('<circle cx="60" cy="52" r="30" fill="' + c.skin + '"/>');

  // 앞머리
  if (c.hairstyle === "bob") p.push('<path d="M28,58 Q24,16 60,16 Q96,16 92,58 L93,76 Q87,78 86,62 Q84,38 60,36 Q36,38 34,62 Q33,78 27,76 Z" fill="' + c.hair + '"/>');
  else p.push('<path d="M29,50 Q28,16 60,16 Q92,16 91,50 Q82,32 60,33 Q38,32 29,50 Z" fill="' + c.hair + '"/>');

  // 눈
  [49, 71].forEach(function (x) {
    if (m.eyes === "arc") p.push('<path d="M' + (x - 5) + ',56 Q' + x + ',49 ' + (x + 5) + ',56" stroke="' + ink + '" stroke-width="2.6" fill="none" stroke-linecap="round"/>');
    else if (m.eyes === "wide") p.push('<circle cx="' + x + '" cy="54" r="5.5" fill="#fff" stroke="' + ink + '" stroke-width="1.6"/><circle cx="' + x + '" cy="54" r="2.2" fill="' + ink + '"/>');
    else p.push('<circle cx="' + x + '" cy="55" r="3" fill="' + ink + '"/>');
  });

  // 눈썹
  var brows = {
    flat: ["M43,44 L55,44", "M65,44 L77,44"], up: ["M43,40 L55,39", "M65,39 L77,40"],
    tilt: ["M43,45 L55,44", "M65,41 L77,37"], sad: ["M43,47 L55,42", "M65,42 L77,47"]
  }[m.brow] || [];
  brows.forEach(function (d) { p.push('<path d="' + d + '" stroke="' + ink + '" stroke-width="2.4" stroke-linecap="round"/>'); });

  if (c.glasses) p.push('<g fill="none" stroke="' + ink + '" stroke-width="1.8"><circle cx="49" cy="55" r="9"/><circle cx="71" cy="55" r="9"/><path d="M58,55 L62,55"/></g>');

  // 입
  p.push({
    smile: '<path d="M52,67 Q60,75 68,67" stroke="' + ink + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    open: '<ellipse cx="60" cy="70" rx="6.5" ry="5" fill="#8a3434"/>',
    o: '<circle cx="60" cy="71" r="4" fill="#8a3434"/>',
    flat: '<path d="M54,70 L66,70" stroke="' + ink + '" stroke-width="2.4" stroke-linecap="round"/>',
    frown: '<path d="M52,73 Q60,66 68,73" stroke="' + ink + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
  }[m.mouth]);

  // 오른팔: 표정에 따라 움직인다
  var arm = { down: ["M88,112 L96,152", 96, 155], point: ["M88,110 L122,82", 126, 79], raise: ["M88,110 L108,66", 110, 61], chin: ["M88,112 L100,140 L72,90", 70, 86] }[m.arm];
  p.push('<path d="' + arm[0] + '" stroke="' + c.shirt + '" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>');
  p.push('<circle cx="' + arm[1] + '" cy="' + arm[2] + '" r="6.5" fill="' + c.skin + '"/>');

  var body = flip ? '<g transform="translate(130,0) scale(-1,1)">' + p.join("") + "</g>" : p.join("");
  // 물음표·느낌표는 뒤집히면 안 되므로 반전 묶음 바깥에 그린다
  var mark = m.mark ? '<text x="' + (flip ? 14 : 116) + '" y="30" font-size="30" font-weight="800" text-anchor="middle" fill="#d9480f">' + m.mark + "</text>" : "";
  return '<svg viewBox="-10 0 150 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + charId + " " + moodId + '">' + body + mark + "</svg>";
}

</script>
<script>
  var CAST = JSON.parse(document.getElementById("cast").textContent);
  var comic = JSON.parse(document.getElementById("data").textContent);
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>"); }

  document.getElementById("title").textContent = comic.title;
  document.getElementById("lead").textContent = "「" + comic.report_title + "」의 내용을 " + comic.panels.length + "컷으로 옮겼습니다. 등장인물은 가상의 인물이며, 컷 아래의 시각을 누르면 영상의 해당 부분으로 갑니다.";

  document.getElementById("grid").innerHTML = comic.panels.map(function (p) {
    var bg = p.background, board = "";
    if (bg.kind === "screen") board = '<div class="board">' + (bg.image ? '<img src="' + esc(bg.image) + '" alt="영상 화면">' : "<pre>" + esc(bg.text) + "</pre>") + "</div>";
    return '<figure class="panel ' + (bg.kind === "office" ? "office" : "") + (p.people.length < 2 ? " solo" : "") + '" id="c' + p.n + '">' +
      '<div class="bubbles">' + p.bubbles.map(function (b) { return '<div class="bubble ' + b.side + '">' + md(b.text) + "</div>"; }).join("") + "</div>" +
      '<div class="stage">' + board + p.people.map(function (a) {
        return '<div class="actor ' + a.side + '">' + drawCharacter(CAST, a.character, a.mood, a.side === "right") + '<span class="name">' + esc(a.name) + "</span></div>";
      }).join("") + "</div>" +
      '<figcaption><span class="n">' + p.n + '</span><span class="nar">' + md(p.narration || "") + "</span>" +
      (p.t_label ? '<a class="ts" href="#t=' + p.t + '" data-t="' + p.t + '">▶ ' + p.t_label + "</a>" : "") + "</figcaption></figure>";
  }).join("");

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.ts");
    if (!a) return;
    e.preventDefault();
    if (window.parent !== window) window.parent.postMessage({ type: "seek", t: Number(a.dataset.t) }, "*");
  });
</script>
</body>
</html>
