<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<!-- 글꼴을 못 받아도 기기 글꼴로 그대로 읽힌다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  /* 만화는 다크모드에서도 종이 위에 있다 — 색을 바꾸지 않는다. */
  :root { --ink: #1b1b1f; --paper: #fffdf7; --desk: #f3efe4; --sun: #ffd65a; --sky: #cfe9ff; --mint: #d2f2de; --rose: #ffdbe0; --lilac: #e6dcff; --butter: #ffedb5; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 12px 60px; background: var(--desk); color: var(--ink); font-family: "Gaegu", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
  main { max-width: 940px; margin: 0 auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 6px; padding: 20px; box-shadow: 7px 7px 0 var(--ink); }
  h1 { font-family: "Jua", "Malgun Gothic", sans-serif; font-weight: 400; font-size: 31px; line-height: 1.25; margin: 0 0 4px; }
  h1 span { background: linear-gradient(transparent 58%, var(--sun) 58%); padding: 0 4px; }
  .lead { margin: 0 0 16px; font-size: 18px; line-height: 1.35; color: #55545c; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }

  /* 컷: 위에 말풍선(대사 길이만큼 늘어남), 아래에 무대(인물 + 스크린). 화면이 있는 컷은 가로로 길게. */
  .panel { position: relative; margin: 0; display: flex; flex-direction: column; border: 3.5px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--sky); isolation: isolate; }
  .panel.wide { grid-column: 1 / -1; }
  .panel.c1 { background: var(--mint); } .panel.c2 { background: var(--rose); } .panel.c3 { background: var(--lilac); } .panel.c4 { background: var(--butter); }
  .panel::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(27,27,31,.17) 1.6px, transparent 1.7px); background-size: 11px 11px;
    -webkit-mask-image: linear-gradient(200deg, #000, transparent 58%); mask-image: linear-gradient(200deg, #000, transparent 58%); }
  .panel.burst::after { content: ""; position: absolute; inset: -40%; z-index: -1; background: repeating-conic-gradient(rgba(27,27,31,.12) 0 2deg, transparent 2deg 9deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0 28%, #000 62%); mask-image: radial-gradient(circle, transparent 0 28%, #000 62%); }
  .num { position: absolute; left: 0; top: 0; z-index: 3; font-family: "Jua", sans-serif; font-size: 16px; background: var(--ink); color: var(--paper); padding: 1px 10px 2px; border-bottom-right-radius: 10px; }
  .caption { align-self: center; margin: 12px 44px 0; transform: rotate(-1deg); font-family: "Jua", sans-serif; font-size: 16px; line-height: 1.3; text-align: center; background: var(--sun); border: 3px solid var(--ink); padding: 2px 13px 3px; box-shadow: 3px 3px 0 var(--ink); }

  .bubbles { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 16px 14px 24px; min-height: 104px; }
  .caption + .bubbles { padding-top: 12px; }
  .wide .bubbles { flex-direction: row; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 22px 4%; }
  .bubble { position: relative; max-width: 86%; padding: 9px 16px 11px; font-size: 20px; font-weight: 700; line-height: 1.25; letter-spacing: -.04em; background: #fff; border: 3px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; box-shadow: 3px 4px 0 var(--ink); }
  .wide .bubble { max-width: 46%; }
  .bubble.left { align-self: flex-start; } .bubble.right { align-self: flex-end; margin-left: auto; border-radius: 18px 255px 18px 225px / 225px 18px 255px 18px; }
  .bubble::before, .bubble::after { content: ""; position: absolute; width: 0; height: 0; border-style: solid; border-color: var(--ink) transparent transparent; }
  .bubble.left::before { left: 28px; bottom: -24px; border-width: 24px 8px 0 16px; }
  .bubble.left::after { left: 32px; bottom: -16px; border-width: 18px 5px 0 11px; border-top-color: #fff; }
  .bubble.right::before { right: 28px; bottom: -24px; border-width: 24px 16px 0 8px; }
  .bubble.right::after { right: 32px; bottom: -16px; border-width: 18px 11px 0 5px; border-top-color: #fff; }
  .bubble.shout { background: var(--sun); border-radius: 12px; transform: rotate(-1.5deg); }
  .bubble.shout::after { border-top-color: var(--sun); }
  .bubble code, .caption code { font-family: ui-monospace, Consolas, monospace; font-size: .76em; font-weight: 700; letter-spacing: 0; background: var(--sun); border-radius: 5px; padding: 0 5px; }
  .bubble.shout code { background: #fff; } .caption code { background: #fff; }

  .stage { position: relative; aspect-ratio: 16 / 9; }
  .wide .stage { aspect-ratio: 16 / 6.2; }
  /* 화면 없이 넓어진 컷: 두 사람을 가운데로 모으고 낮게 */
  .wide:not(.has-screen) .stage { aspect-ratio: 16 / 5.2; }
  .wide:not(.has-screen) .actor.left { left: 16%; } .wide:not(.has-screen) .actor.right { right: 16%; }
  .wide:not(.has-screen) .bubbles { padding-left: 13%; padding-right: 13%; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 20%; background: var(--paper); border-top: 3px solid var(--ink); }
  .actor { position: absolute; bottom: -3%; height: 100%; aspect-ratio: 1000 / 1200; }
  .actor.left { left: 0; } .actor.right { right: 0; }
  .solo .actor { left: 50%; transform: translateX(-50%); }
  .peep-svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .name { position: absolute; bottom: 7%; font-family: "Jua", sans-serif; font-size: 13.5px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 6px; padding: 0 8px 1px; white-space: nowrap; }
  .actor.left .name { left: 10%; transform: rotate(-3deg); } .actor.right .name { right: 10%; transform: rotate(3deg); }
  .mark { position: absolute; top: 2%; font-family: "Jua", sans-serif; font-size: 44px; line-height: 1; color: #ff4d5e; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
  .actor.left .mark { left: 8%; transform: rotate(-12deg); } .actor.right .mark { right: 8%; transform: rotate(12deg); }

  /* 영상의 실제 화면 — 천장에서 내린 스크린 */
  .screen { position: absolute; left: 50%; top: 3%; width: 47%; transform: translateX(-50%) rotate(-.8deg); }
  .wide .screen { width: 39%; }
  .solo .screen { left: 66%; } .solo.has-screen .actor { left: 2%; transform: none; }
  .screen .bar { height: 11px; margin: 0 -9px; background: var(--ink); border-radius: 4px; }
  .screen img, .screen pre { display: block; width: 100%; margin: 0; border: 3.5px solid var(--ink); border-top: 0; background: #fff; }
  .screen pre { aspect-ratio: 16 / 9; padding: 8px 10px; overflow: hidden; white-space: pre-wrap; font: 600 10.5px/1.45 "Malgun Gothic", system-ui, sans-serif; }
  .screen .pull { width: 3px; height: 16px; margin: 0 auto; background: var(--ink); }
  .screen .pull::after { content: ""; display: block; width: 11px; height: 11px; margin: 14px 0 0 -4px; border: 3px solid var(--ink); border-radius: 50%; background: var(--paper); }

  a.ts { position: absolute; right: 9px; bottom: 8px; z-index: 3; font-family: "Jua", sans-serif; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--sun); border: 2.5px solid var(--ink); border-radius: 999px; padding: 0 10px 1px; text-decoration: none; box-shadow: 2px 2px 0 var(--ink); }
  a.ts:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .credit { margin: 16px 2px 0; font-size: 14px; color: #77767e; }

  @media (max-width: 700px) {
    body { padding: 10px 6px 40px; } main { padding: 12px; box-shadow: 4px 4px 0 var(--ink); }
    h1 { font-size: 25px; } .lead { font-size: 16px; }
    .grid { grid-template-columns: 1fr; }
    .wide .stage, .wide:not(.has-screen) .stage { aspect-ratio: 16 / 9; } .wide:not(.has-screen) .actor.left { left: 0; } .wide:not(.has-screen) .actor.right { right: 0; } .wide:not(.has-screen) .bubbles { padding-left: 14px; padding-right: 14px; } .wide .screen { width: 47%; } .wide .bubble { max-width: 86%; }
    .wide .bubbles { flex-direction: column; align-items: stretch; }
    .bubble { font-size: 18px; } .mark { font-size: 34px; }
    /* 좁은 화면: 스크린을 위에 크게, 인물은 그 아래에 작게 — 스크린 글자가 인물에 가리지 않게 */
    .has-screen .stage, .wide.has-screen .stage { aspect-ratio: 16 / 15.5; }
    .has-screen .screen, .wide.has-screen .screen, .solo .screen { left: 50%; width: 88%; top: 1%; }
    .has-screen .actor { height: 50%; } .has-screen .floor { height: 11%; }
  }
  @media print { body { background: #fff; padding: 0; } main { box-shadow: none; border: 0; } .panel { break-inside: avoid; } a.ts { display: none; } }
</style>
</head>
<body>
<main>
  <h1><span id="title"></span></h1>
  <p class="lead" id="lead"></p>
  <div class="grid" id="grid"></div>
  <p class="credit">등장인물은 가상의 인물입니다. 그림: Open Peeps (Pablo Stanley, CC0)</p>
</main>
<script id="cast" type="application/json">{{cast_json}}</script>
<script id="parts" type="application/json">{{parts_json}}</script>
<script id="data" type="application/json">{{comic_json}}</script>
<script>
var PARTS = JSON.parse(document.getElementById("parts").textContent);
{{characters_js}}
</script>
<script>
  var CAST = JSON.parse(document.getElementById("cast").textContent);
  var comic = JSON.parse(document.getElementById("data").textContent);
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>"); }

  document.getElementById("title").textContent = comic.title;
  document.getElementById("lead").textContent = "「" + comic.report_title + "」의 내용을 " + comic.panels.length + "컷으로 옮겼습니다. 컷 구석의 시각을 누르면 영상의 그 부분으로 갑니다.";

  document.getElementById("grid").innerHTML = comic.panels.map(function (p, i) {
    var bg = p.background, screen = "", moods = p.people.map(function (a) { return a.mood; });
    if (bg.kind === "screen") screen = '<div class="screen"><div class="bar"></div>' + (bg.image ? '<img src="' + esc(bg.image) + '" alt="영상 화면">' : "<pre>" + esc(bg.text) + "</pre>") + '<div class="pull"></div></div>';
    var cls = ["panel", "c" + (i % 5)];
    if (screen && p.people.length === 2) cls.push("wide");
    if (screen) cls.push("has-screen");
    if (p.people.length < 2) cls.push("solo");
    if (moods.indexOf("surprised") >= 0) cls.push("burst");   // 놀라는 컷에는 집중선
    return '<figure class="' + cls.join(" ") + '" id="c' + p.n + '"><span class="num">' + p.n + "</span>" +
      (p.narration ? '<div class="caption">' + md(p.narration) + "</div>" : "") +
      '<div class="bubbles">' + p.bubbles.map(function (b) {
        var shout = /!\s*$/.test(b.text) && b.text.length <= 28;   // 짧게 외치는 대사는 노란 말풍선
        return '<div class="bubble ' + b.side + (shout ? " shout" : "") + '">' + md(b.text) + "</div>";
      }).join("") + "</div>" +
      '<div class="stage"><div class="floor"></div>' + screen + p.people.map(function (a) {
        var mark = (CAST.moods[a.mood] || {}).mark;
        return '<div class="actor ' + a.side + '">' + drawCharacter(CAST, a.character, a.mood, a.side === "right") +
          (mark ? '<span class="mark">' + esc(mark) + "</span>" : "") + '<span class="name">' + esc(a.name) + "</span></div>";
      }).join("") + "</div>" +
      (p.t_label ? '<a class="ts" href="#t=' + p.t + '" data-t="' + p.t + '">▶ ' + p.t_label + "</a>" : "") + "</figure>";
  }).join("");

  // 좁은 컷은 둘씩 나란히 놓인다. 짝이 없는 좁은 컷은 넓게 펴서 옆이 비지 않게 한다.
  var figs = [].slice.call(document.querySelectorAll(".panel")), run = [];
  figs.concat([null]).forEach(function (f) {
    if (f && !f.classList.contains("wide")) { run.push(f); return; }
    if (run.length % 2) run[run.length - 1].classList.add("wide");
    run = [];
  });

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.ts");
    if (!a) return;
    e.preventDefault();
    if (window.parent !== window) window.parent.postMessage({ type: "seek", t: Number(a.dataset.t) }, "*");
  });
</script>
</body>
</html>
