<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e2da;
    --accent: #2f5fd0; --accent-soft: #e8eefc; --warn: #a15c00; --warn-soft: #fff4e0; --ok-soft: #e9f6ee;
    --ink: #1b1b1f; --sun: #ffd65a; --sun-soft: #fff3c9; --shadow: #1b1b1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa2ad; --line: #30353d;
      --accent: #8fb0ff; --accent-soft: #232c45; --warn: #ffc266; --warn-soft: #3a2d14; --ok-soft: #1c3226;
      --ink: #d9dce1; --sun: #f2c94c; --sun-soft: #3a3320; --shadow: #000;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
  header .meta { color: var(--muted); font-size: 14px; }
  header .meta span + span::before { content: "·"; margin: 0 8px; }
  h1 { font-size: 30px; line-height: 1.3; margin: 8px 0 20px; letter-spacing: -.02em; }
  h1 span { background: linear-gradient(transparent 62%, var(--sun) 62%); }
  .summary { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; margin: 0 0 8px; box-shadow: 4px 4px 0 var(--shadow); }
  section { margin-top: 36px; }
  h2 { display: flex; align-items: center; gap: 10px; font-size: 20px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  h2::before { content: ""; flex: none; width: 12px; height: 12px; background: var(--sun); border: 2px solid var(--ink); border-radius: 50%; }
  h3 { font-size: 16px; margin: 24px 0 8px; color: var(--muted); }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 8px 0; }
  .table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  td a.ts { margin-left: 0; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  a.ts {
    font-variant-numeric: tabular-nums; font-size: 12.5px; text-decoration: none; white-space: nowrap;
    color: var(--text); background: var(--sun-soft); border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 8px; margin-left: 4px;
  }
  a.ts::before { content: "▶ "; font-size: .72em; }
  a.ts:hover { background: var(--sun); color: #1b1b1f; }
  section.decisions li, section.actions li { list-style: none; margin-left: -20px; padding: 10px 14px; border-radius: 10px; background: var(--ok-soft); }
  section.actions li { background: var(--surface); border: 1px solid var(--line); }
  section.conflicts { background: var(--sun-soft); border: 2px dashed var(--ink); border-radius: 14px; padding: 16px 20px; }
  section.conflicts h2 { border-color: transparent; margin-bottom: 4px; }
  section.conflicts h2::before { content: "!"; display: grid; place-items: center; width: 20px; height: 20px; font-size: 13px; font-weight: 800; color: #1b1b1f; }
  p.note { margin: 0 0 10px; font-size: 13.5px; color: var(--muted); }
  .thumbs { display: flex; gap: 10px; margin: 0 0 12px; }
  a.thumb { position: relative; display: block; flex: 0 1 220px; padding: 0; margin: 0; border-radius: 10px; overflow: hidden; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow); transition: transform .12s; }
  a.thumb:hover { transform: translate(-1px, -1px); }
  a.thumb::before { content: none; }
  a.thumb img { display: block; width: 100%; height: auto; }
  a.thumb span { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; }
  .toolbar { display: flex; justify-content: flex-end; margin: 0 0 8px; }
  .toolbar button { font: inherit; font-size: 14px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  body.embedded .toolbar { display: none; }
  body.embedded { background: transparent; } body.embedded main { padding-top: 26px; }  /* 함께 보기 화면 안에 끼워졌을 때는 바깥 화면이 버튼을 갖는다 */
  @page { margin: 18mm 16mm; }
  @media print {
    :root { --bg: #fff; --surface: #fff; --text: #111; --muted: #555; --line: #ccc; --accent: #1d3a8a; --accent-soft: transparent; --warn: #7a4500; --warn-soft: #fff; --ok-soft: #fff; }
    body { background: #fff; font-size: 11pt; }
    main { max-width: none; padding: 0; }
    .toolbar { display: none; }
    a.ts { background: none; padding: 0; color: #555; font-size: 9.5pt; }
    a.ts { border: 0; } a.ts::before { content: "["; font-size: 1em; } a.ts::after { content: "]"; }
    h1 span { background: none; } h2::before { content: none; } .summary, a.thumb { box-shadow: none; }
    a.thumb::before, a.thumb::after { content: none; }
    h2, h3 { break-after: avoid; }
    li, tr, .thumbs, section.conflicts { break-inside: avoid; }
    section.decisions li, section.actions li, .summary, .table-wrap, section.conflicts { border: 1px solid #ccc; background: #fff; }
  }
</style>
</head>
<body>
<main>
  <div class="toolbar"><button onclick="window.print()">PDF로 저장 · 인쇄</button></div>
  <header>
    <div class="meta"><span>{{type_label}}</span><span>영상 길이 {{duration}}</span></div>
    <h1><span>{{title}}</span></h1>
  </header>
  <p class="summary">{{summary}}</p>
  {{body}}
</main>
<script>
  // 이 문서는 영상을 담지 않는다. 함께 보기 화면(watch.html)이나 웹 앱 안에 끼워져 있으면(iframe),
  // 타임스탬프를 눌렀을 때 바깥 화면에 "이 시각으로 가 달라"고 알린다.
  if (window.parent !== window) document.body.classList.add("embedded");
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.ts");
    if (!a) return;
    e.preventDefault();
    if (window.parent !== window) window.parent.postMessage({ type: "seek", t: Number(a.dataset.t) }, "*");
  });
  // 바깥 화면의 목차를 누르면 그 섹션으로 내려간다
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== "goto") return;
    var el = document.getElementById("s" + Number(e.data.section));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
</script>
</body>
</html>
