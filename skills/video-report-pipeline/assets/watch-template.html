<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — 영상과 함께 보기</title>
<style>
  :root { --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e2da; --accent: #2f5fd0; --accent-soft: #e8eefc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa2ad; --line: #30353d; --accent: #8fb0ff; --accent-soft: #232c45; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .layout { display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; height: 100vh; }
  .left { padding: 16px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); min-width: 0; }
  .left h1 { font-size: 17px; margin: 0; line-height: 1.35; }
  .left a.back { font-size: 13px; color: var(--muted); text-decoration: none; }
  video { width: 100%; border-radius: 10px; background: #000; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .tabs button { font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; background: transparent; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  /* 좁은 화면: 영상을 위에 고정하고 문서는 아래에서 스크롤 */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; gap: 6px; }
    .left .hint, .left a.back { display: none; }
    video { max-height: 34vh; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="left">
    <a class="back" href="index.html">← 모아보기</a>
    <h1>{{title}}</h1>
    <video id="player" src="{{video}}" controls preload="metadata"></video>
    <p class="hint">오른쪽 문서의 시각을 누르면 영상이 그 지점으로 이동합니다.</p>
  </div>
  <div class="right">
    <div class="tabs" id="tabs">{{tabs}}</div>
    <iframe id="doc" src="{{first}}" title="문서"></iframe>
  </div>
</div>
<script>
  var player = document.getElementById("player"), doc = document.getElementById("doc");
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    document.querySelectorAll("#tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
    doc.src = b.dataset.src;
  });
  // 안에 끼운 문서(리포트·퀴즈·만화)가 "이 시각으로 가 달라"고 알려 오면 영상을 옮긴다.
  window.addEventListener("message", function (e) {
    if (e.source !== doc.contentWindow || !e.data || e.data.type !== "seek") return;
    player.currentTime = Number(e.data.t) || 0;
    player.play();
  });
</script>
</body>
</html>
