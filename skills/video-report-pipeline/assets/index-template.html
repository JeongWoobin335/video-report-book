<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e2da; --accent: #2f5fd0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa2ad; --line: #30353d; --accent: #8fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; line-height: 1.65; word-break: keep-all; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0; }
  h1 { font-size: 30px; line-height: 1.3; margin: 6px 0 18px; }
  .summary { margin: 0 0 32px; font-size: 16.5px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  a.card { display: flex; flex-direction: column; gap: 4px; padding: 22px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .icon { font-size: 28px; }
  a.card strong { font-size: 18px; }
  a.card span:last-child { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="meta">{{meta}}</p>
  <h1>{{title}}</h1>
  <p class="summary">{{summary}}</p>
  <div class="cards">
{{cards}}
  </div>
</main>
</body>
</html>
