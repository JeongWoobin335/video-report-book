<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — 결과</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e2da;
    --accent: #2f5fd0; --accent-soft: #e8eefc; --ok: #1a7f4b; --ok-soft: #d8efe2; --bad: #b42318; --bad-soft: #f9d9d5; --warn-soft: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --surface: #1e2126; --text: #e6e8eb; --muted: #9aa2ad; --line: #30353d;
      --accent: #8fb0ff; --accent-soft: #232c45; --ok: #6fd39b; --ok-soft: #1f4430; --bad: #ff9b91; --bad-soft: #5a2a25; --warn-soft: #3a2d14;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  }
  main { max-width: 820px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  h2 { font-size: 19px; margin: 36px 0 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 0 0 12px; }
  #insights { background: var(--warn-soft); border-radius: 14px; padding: 4px 22px 14px; }
  #insights:empty { display: none; }
  #insights h2 { margin-top: 18px; }
  #insights li { margin: 10px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .q-head { display: flex; gap: 12px; align-items: baseline; }
  .q-head .rate { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  .q-head .rate.low { color: var(--bad); }
  .tags { margin: 4px 0 10px; font-size: 12.5px; color: var(--muted); }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-right: 4px; }
  .tag.flag { border-color: var(--bad); color: var(--bad); }
  .choice { display: grid; grid-template-columns: 1fr 90px 34px; gap: 10px; align-items: center; font-size: 14.5px; margin: 6px 0; }
  .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--bad-soft); }
  .choice.right .bar i { background: var(--ok); }
  .choice.right span:first-child { font-weight: 600; }
  .choice .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  .span { font-variant-numeric: tabular-nums; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; font-size: 13px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p class="meta" id="meta"></p>
  <div id="insights">{{insights}}</div>
  <div class="stats" id="stats"></div>
  <h2 id="items-title">문항별 응답</h2>
  <div id="items"></div>
  <div id="extra"></div>
</main>
<script id="data" type="application/json">{{summary_json}}</script>
<script>
  var S = JSON.parse(document.getElementById("data").textContent), meeting = S.type === "meeting";
  var FLAG = { low: "정답률 낮음", wrong_beats_right: "오답이 정답보다 많음", scattered: "오답이 흩어짐", strong_miss: "잘하는 사람이 틀림" };
  var CHECK = { recall: "기억", understanding: "이해" };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>"); }
  function pct(x) { return x == null ? "–" : Math.round(x * 100) + "%"; }

  document.getElementById("meta").textContent = "응답 " + S.respondents + "명" + (meeting ? " · 성적이 아니라, 회의 내용이 어디서 다르게 전달됐는지를 보는 자료입니다" : "");

  var stats = meeting ? [] : [[pct(S.average_rate), "평균 정답률"]];
  if (!meeting) Object.keys(S.by_checks).forEach(function (k) { stats.push([pct(S.by_checks[k]), CHECK[k] + " 문항 정답률"]); });
  stats.push([S.items.filter(function (i) { return i.flags.length; }).length + "개", meeting ? "다르게 알고 있는 분이 많은 항목" : "살펴볼 문항"]);
  document.getElementById("stats").innerHTML = stats.map(function (s) { return '<div class="stat"><b>' + s[0] + "</b><span>" + s[1] + "</span></div>"; }).join("");

  if (meeting) document.getElementById("items-title").textContent = "항목별 응답";
  document.getElementById("items").innerHTML = S.items.map(function (it, i) {
    return '<div class="card"><div class="q-head"><span>' + (i + 1) + ". " + md(it.question) + '</span><span class="rate' + (it.correct_rate < 0.5 ? " low" : "") + '">' + pct(it.correct_rate) + "</span></div>" +
      '<div class="tags"><span class="tag">' + esc(it.section) + "</span>" + (meeting ? "" : '<span class="tag">' + CHECK[it.checks] + "</span>") +
      it.flags.map(function (f) { return '<span class="tag flag">' + FLAG[f] + "</span>"; }).join("") + "</div>" +
      it.choices.map(function (c) {
        return '<div class="choice' + (c.id === it.answer ? " right" : "") + '"><span>' + (c.text ? md(c.text) : esc(c.id)) + '</span><div class="bar"><i style="width:' + (c.count / S.respondents * 100) + '%"></i></div><span class="n">' + c.count + "명</span></div>";
      }).join("") + "</div>";
  }).join("");

  var extra = "";
  if (S.hot_spans.length) {
    extra += "<h2>" + (meeting ? "다시 공유가 필요한 구간" : "많이 틀린 구간") + '</h2><div class="card">' +
      S.hot_spans.map(function (h) { return '<span class="span">' + h.label + "</span>"; }).join(" ") + "</div>";
  }
  if (S.people) {
    extra += '<h2>응답자별</h2><div class="card"><table><tr><th>응답자</th><th>정답</th><th>다시 볼 구간</th></tr>' +
      S.people.map(function (p) {
        return "<tr><td>" + esc(p.respondent) + "</td><td>" + p.correct + " / " + p.total + "</td><td>" +
          (p.review.map(function (r) { return '<span class="span">' + r + "</span>"; }).join(" ") || "–") + "</td></tr>";
      }).join("") + "</table></div>";
  }
  document.getElementById("extra").innerHTML = extra;
</script>
</body>
</html>
